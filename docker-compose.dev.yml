services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEMO_MODE=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["pnpm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
